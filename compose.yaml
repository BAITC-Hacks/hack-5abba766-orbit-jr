services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: career_quest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_quest_local}
      POSTGRES_DB: career_quest
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_quest -d career_quest"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: career_quest
      PGPASSWORD: ${POSTGRES_PASSWORD:-career_quest_local}
      PGDATABASE: career_quest
      DATASET_DIR: /app/data/source
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-3000}}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:-employee-demo-2026}
      DEMO_HR_PASSWORD: ${DEMO_HR_PASSWORD:-hr-demo-2026}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./data/source:/app/data/source:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 30s
volumes:
  postgres_data:
